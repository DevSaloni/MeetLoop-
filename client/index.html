  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MeetLoop",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered meeting accountability platform that extracts tasks, tracks commitments, and drives team accountability automatically.",
      "url": "https://meetloop-jet.vercel.app",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "120"
      },
      "featureList": [
        "AI Task Extraction from Meeting Transcripts",
        "Digital Handshake Commitment Confirmation",
        "Team Accountability Dashboard",
        "Reliability Score Analytics",
        "Real-time Task Tracking",
        "Global Search Across Meetings"
      ],
      "author": {
        "@type": "Organization",
        "name": "MeetLoop Inc.",
        "url": "https://meetloop-jet.vercel.app"
      }
    }
  </script>

  <!-- Structured Data - FAQPage (for How It Works page FAQs) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does MeetLoop turn meeting notes into tasks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Paste your transcript into the New Meeting form. Gemini AI reads it, extracts every action item, assigns it to the right person, sets a priority, and generates an executive summary — all in seconds."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Reliability Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It's your personal performance metric: tasks completed ÷ total tasks assigned × 100. A score above 90% shows as Excellent on your dashboard. It updates live every time you mark a task done."
          }
        },
        {
          "@type": "Question",
          "name": "Do all team members need an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each member gets their own dashboard to view and complete their tasks. The Team Lead shares a unique team code — members sign up and join instantly."
          }
        },
        {
          "@type": "Question",
          "name": "Can I manage multiple teams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Create separate workspaces for Engineering, Marketing, or any department. All teams appear in your sidebar and each has its own meetings, tasks, and analytics."
          }
        },
        {
          "@type": "Question",
          "name": "What if the AI misses a task or assigns it wrong?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You stay in full control. Edit the transcript anytime from the Notes tab, then hit 'Refresh AI Context' to re-run the analysis. All existing task statuses are preserved."
          }
        }
      ]
    }
  </script>
